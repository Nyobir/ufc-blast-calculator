name: Build Windows EXE

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:  # manual trigger

permissions:
  contents: write  # needed for creating releases

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Visual C++ Redistributable
        run: |
          choco install vcredist-all -y

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: |
          uv pip install --system numpy scipy matplotlib pyside6 pyinstaller

      - name: Build EXE
        run: pyinstaller ufc_blast.spec

      - name: Smoke test — CLI point command
        run: |
          dist\ufc-blast\ufc-blast.exe point --W 200 --R 30 --Hc 5 --alpha 0

      - name: Smoke test — GUI import check
        run: |
          dist\ufc-blast\ufc-blast.exe gui-check

      - name: Zip distribution
        run: |
          Compress-Archive -Path dist\ufc-blast -DestinationPath dist\ufc-blast-windows.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ufc-blast-windows
          path: dist/ufc-blast-windows.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ufc-blast-windows.zip
